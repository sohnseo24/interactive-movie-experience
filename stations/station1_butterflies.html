<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Forest of Butterflies - 나비의 숲</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #05070c; }
        canvas { display: block; width: 100%; height: 100%; }
        .back-btn {
            position: absolute; top: 30px; left: 30px; z-index: 10;
            padding: 12px 24px; background: rgba(11, 15, 25, 0.7); border: 1px solid #ffca2c;
            color: #ffca2c; cursor: pointer; text-decoration: none;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-weight: 600; font-size: 0.85rem;
            letter-spacing: 0.05rem; border-radius: 4px; backdrop-filter: blur(5px);
            transition: all 0.3s ease;
        }
        .back-btn:hover { background: #ffca2c; color: #0b0f19; box-shadow: 0 0 15px #ffca2c; }
    </style>
</head>
<body>

    <a href="../index.html" class="back-btn">← BACK TO PLATFORM</a>
    <canvas id="butterflyCanvas"></canvas>

    <script>
        // 1번 역 배경음악 엔진 세팅
        let bgm = new Audio("../assets/station1_bgm.mp3");
        bgm.loop = true;
        bgm.volume = 0.5; // 볼륨 크기 (0.0 ~ 1.0)

        // 브라우저 보안 정책 우회: 사용자가 화면을 클릭하면 음악 스타트!
        window.addEventListener('click', () => {
            bgm.play().catch(e => console.log("오디오 재생 시작"));
        }, { once: true }); // 딱 한 번만 실행
        ////////////////////////////////////////////////////////////////////////////

        const canvas = document.getElementById('butterflyCanvas');
        const ctx = canvas.getContext('2d');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        let butterflies = [];
        let mouse = { x: -1000, y: -1000, radius: 160 };

        window.addEventListener('mousemove', (e) => { mouse.x = e.clientX; mouse.y = e.clientY; });
        window.addEventListener('mouseout', () => { mouse.x = -1000; mouse.y = -1000; });

        class ProceduralButterfly {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.vx = (Math.random() - 0.5) * 1.5;
                this.vy = (Math.random() - 0.5) * 1.5;
                
                this.size = Math.random() * 10 + 20; 
                this.wingPhase = Math.random() * Math.PI;
                this.wingSpeed = 0.12; 
                this.isAuraActive = false;
            }

            update() {
                this.x += this.vx; this.y += this.vy;
                
                if (this.x < 10 || this.x > canvas.width - 10) this.vx *= -1;
                if (this.y < 10 || this.y > canvas.height - 10) this.vy *= -1;

                this.wingPhase += this.wingSpeed;

                let dx = this.x - mouse.x;
                let dy = this.y - mouse.y;
                let distance = Math.sqrt(dx * dx + dy * dy);

                if (distance < mouse.radius) {
                    this.isAuraActive = true;
                    this.wingSpeed = 0.35; 

                    let force = (mouse.radius - distance) / mouse.radius;
                    let angle = Math.atan2(dy, dx);
                    this.x += Math.cos(angle) * force * 8;
                    this.y += Math.sin(angle) * force * 8;
                } else {
                    this.isAuraActive = false;
                    this.wingSpeed = 0.12;
                }
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                
                let angle = Math.atan2(this.vy, this.vx);
                ctx.rotate(angle + Math.PI/2);

                let currentWingWidth = Math.abs(Math.sin(this.wingPhase)) * this.size;

                // 최적화: 마우스 주변일 때만 글로우 이펙트
                if (this.isAuraActive) {
                    ctx.shadowBlur = 25;
                    ctx.shadowColor = '#00bfff';
                    ctx.fillStyle = '#00bfff';
                } else {
                    // 평소 상태일 때는 무거운 shadowBlur를 끄고, 자체 투명도와 색상으로 렌더링
                    ctx.shadowBlur = 0; 
                    ctx.fillStyle = 'rgba(255, 202, 44, 0.85)'; 
                }

                // 왼쪽 날개
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.bezierCurveTo(-currentWingWidth * 1.5, -this.size * 1.2, -currentWingWidth * 1.3, this.size * 0.2, 0, this.size * 0.3);
                ctx.bezierCurveTo(-currentWingWidth * 0.9, this.size * 0.8, -currentWingWidth * 0.5, this.size * 1.1, 0, 0);
                ctx.fill();

                // 오른쪽 날개
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.bezierCurveTo(currentWingWidth * 1.5, -this.size * 1.2, currentWingWidth * 1.3, this.size * 0.2, 0, this.size * 0.3);
                ctx.bezierCurveTo(currentWingWidth * 0.9, this.size * 0.8, currentWingWidth * 0.5, this.size * 1.1, 0, 0);
                ctx.fill();

                // 나비 몸통선
                ctx.fillStyle = this.isAuraActive ? '#ffffff' : 'rgba(255, 255, 255, 0.6)';
                ctx.fillRect(-1, -this.size * 0.4, 2, this.size * 0.8);

                ctx.restore();
            }
        }

        for (let i = 0; i < 200; i++) {
            butterflies.push(new ProceduralButterfly());
        }

        function animate() {
            ctx.fillStyle = 'rgba(11, 15, 25, 0.22)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 지하철 격자선
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.015)';
            ctx.lineWidth = 1;
            for(let i=1; i<4; i++) {
                ctx.beginPath();
                ctx.moveTo((canvas.width/4)*i, 0); ctx.lineTo((canvas.width/4)*i, canvas.height);
                ctx.stroke();
            }

            butterflies.forEach(b => {
                b.update();
                b.draw();
            });

            requestAnimationFrame(animate);
        }

        animate();

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth; canvas.height = window.innerHeight;
        });
    </script>
</body>
</html>
